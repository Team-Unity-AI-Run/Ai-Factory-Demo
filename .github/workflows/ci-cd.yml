name: CI/CD
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run tests
      run: pytest
    - name: Security scan
      run: 'pip install bandit

        bandit -r . -x tests,examples'
    - name: Build Docker image
      run: docker build -t demo-app .
    - name: Scan Docker image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: demo-app
        severity: HIGH,CRITICAL
        exit-code: '1'
    - name: Deploy to Kubernetes (manual approval required)
      run: echo 'Kubernetes deployment step is a placeholder for this demo. Configure
        kubectl/helm and cluster credentials via GitHub Secrets before enabling real
        deployment.'
